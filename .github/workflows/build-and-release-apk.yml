name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace || true

      - name: Prepare APK Asset for Release
        run: |
          mkdir -p release-artifacts
          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/debug/*.apk release-artifacts/PiK-Music-SCuII.apk
          elif [ -f public/pik-music-scui.apk ]; then
            cp public/pik-music-scui.apk release-artifacts/PiK-Music-SCuII.apk
          fi
          ls -lh release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiK-Music-SCuII-APK
          path: release-artifacts/PiK-Music-SCuII.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: "PiK Music SCuII Release - ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎵 PiK Music SCuII Android Release
            
            This release contains the installable Android `.apk` for **PiK Music SCuII**.

            ### 📱 Download & Install:
            1. Download **`PiK-Music-SCuII.apk`** below onto your Android phone.
            2. Tap the downloaded file to install.
            3. Enjoy the neon liquid-glass music login screen with Google Sign-In & Guest mode!
          files: |
            release-artifacts/PiK-Music-SCuII.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
