<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1945" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0051ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Water Splash Ring -->
  <circle cx="256" cy="256" r="180" stroke="#00e5ff" stroke-width="3" stroke-dasharray="12 16" opacity="0.6" />
  <circle cx="140" cy="120" r="12" fill="#ffffff" filter="url(#glow)" />
  <circle cx="380" cy="130" r="10" fill="#00e5ff" filter="url(#glow)" />
  <circle cx="390" cy="370" r="14" fill="#00e5ff" filter="url(#glow)" />
  <circle cx="120" cy="380" r="8" fill="#ffffff" />

  <!-- PiK Monogram -->
  <g filter="url(#glow)">
    <path d="M150 160 H210 Q250 160 250 200 Q250 240 210 240 H175 V350 H150 Z M175 185 V215 H205 Q225 215 225 200 Q225 185 205 185 Z" fill="url(#cyanGrad)" />
    <!-- i dot -->
    <circle cx="280" cy="220" r="12" fill="#00e5ff" />
    <!-- K -->
    <path d="M315 160 H340 V245 L395 160 H425 L360 258 L430 350 H395 L340 274 V350 H315 Z" fill="url(#cyanGrad)" />
  </g>

  <!-- Waveform Bar -->
  <rect x="190" y="380" width="8" height="28" rx="4" fill="#00e5ff" />
  <rect x="210" y="370" width="8" height="48" rx="4" fill="#ffffff" />
  <rect x="230" y="360" width="8" height="68" rx="4" fill="#00e5ff" />
  <rect x="250" y="372" width="8" height="44" rx="4" fill="#38bdf8" />
  <rect x="270" y="364" width="8" height="60" rx="4" fill="#ffffff" />
  <rect x="290" y="375" width="8" height="38" rx="4" fill="#00e5ff" />
  <rect x="310" y="382" width="8" height="24" rx="4" fill="#38bdf8" />
</svg>
